worker_processes 2;
error_log /var/logs/nginx/mydomain.error.log;
pid /var/run/nginx.pid;
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include '/etc/nginx/mime.types';
    default_type application/octet-stream;

    # Docker DNS resolver
    resolver 127.0.0.11 valid=30s;

    keepalive_timeout 65;
    keepalive_requests 100000;
    tcp_nopush on;
    tcp_nodelay on;

    proxy_buffers 16 16k;
    proxy_buffer_size 32k;
    proxy_busy_buffers_size 64k;
    proxy_max_temp_file_size 128k;

    # Allow large file uploads (for DICOM/SR creation)
    client_max_body_size 2G;
    client_body_buffer_size 10M;

    server {
        listen 80;
        server_name localhost;

        root /var/www/html;

        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
        gzip_comp_level 9;
        etag on;

        location /sw.js {
            add_header Cache-Control "no-cache";
            proxy_cache_bypass $http_pragma;
            proxy_cache_revalidate on;
            expires off;
            access_log off;
        }

        location /oauth2 {
            expires -1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Auth-Request-Redirect $request_uri;
            proxy_pass http://localhost:4180$uri$is_args$args;
        }

        location /oauth2/callback {
            proxy_pass http://localhost:4180;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /oauth2/sign_out {
            expires -1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Auth-Request-Redirect /oauth2/sign_in;
            proxy_pass http://localhost:4180;
        }

        location /pacs-admin/ {
            error_page 401 = /oauth2/sign_in?rd=$scheme://$host$request_uri;
            auth_request /oauth2/auth;

            auth_request_set $user $upstream_http_x_auth_request_user;
            auth_request_set $token $upstream_http_x_auth_request_access_token;
            auth_request_set $auth_cookie $upstream_http_set_cookie;
            auth_request_set $auth_groups $upstream_http_x_auth_request_groups;

            proxy_set_header X-User $user;
            proxy_set_header X-Access-Token $token;
            proxy_set_header X-Remote-User $user;
            proxy_set_header X-Forwarded-Groups $auth_groups;
            add_header Set-Cookie $auth_cookie;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            expires 0;
            add_header Cache-Control private;

            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Origin, X-Requested-With, Content-Type, Accept' always;

            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Authorization, Origin, X-Requested-With, Content-Type, Accept';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass http://orthanc:8042/;
        }

        location /pacs-admin {
            return 301 /pacs-admin/;
        }

        # Login endpoint (no auth required)
        location /login {
            proxy_pass http://auth-service:8000/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Auth validation endpoint (internal only)
        location = /auth/validate {
            internal;
            proxy_pass http://auth-service:8000/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        # Main DICOMweb API - authenticated and routed based on user group
        location = /api/dicom-web/studies {
            # Require authentication, redirect to login if not authenticated
            error_page 401 = @login_redirect;
            auth_request /auth/validate;
            auth_request_set $user_groups $upstream_http_x_user_groups;
            auth_request_set $user_name $upstream_http_x_user_name;

            # Set group header for filtering
            proxy_set_header X-Forwarded-Groups $user_groups;
            proxy_set_header X-User-Name $user_name;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Don't buffer for uploads
            proxy_request_buffering off;

            expires 0;
            add_header Cache-Control private;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

            # Handle CORS preflight
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            # GET requests go to filter service for study list filtering
            # POST requests (STOW-RS for SR creation) go through auth service to label instances
            set $backend_url "";
            if ($request_method = GET) {
                set $backend_url "http://auth-service:8000/filter/studies";
            }
            if ($request_method = POST) {
                set $backend_url "http://auth-service:8000/upload/studies";
            }

            proxy_pass $backend_url$is_args$args;
        }

        # Series endpoints - filter to hide unauthorized SR series
        location ~ ^/api/dicom-web/studies/([^/]+)/series$ {
            error_page 401 = @login_redirect;
            auth_request /auth/validate;
            auth_request_set $user_groups $upstream_http_x_user_groups;

            proxy_set_header X-Forwarded-Groups $user_groups;
            proxy_http_version 1.1;
            proxy_set_header Host $host;

            add_header 'Access-Control-Allow-Origin' '*' always;

            proxy_pass http://auth-service:8000/filter/series/studies/$1/series$is_args$args;
        }

        # Metadata endpoints - filter to hide unauthorized SRs
        location ~ ^/api/dicom-web/studies/([^/]+)/metadata$ {
            error_page 401 = @login_redirect;
            auth_request /auth/validate;
            auth_request_set $user_groups $upstream_http_x_user_groups;

            proxy_set_header X-Forwarded-Groups $user_groups;
            proxy_http_version 1.1;
            proxy_set_header Host $host;

            add_header 'Access-Control-Allow-Origin' '*' always;

            proxy_pass http://auth-service:8000/filter/metadata/studies/$1/metadata$is_args$args;
        }

        location ~ ^/api/dicom-web/studies/([^/]+)/series/([^/]+)/metadata$ {
            error_page 401 = @login_redirect;
            auth_request /auth/validate;
            auth_request_set $user_groups $upstream_http_x_user_groups;

