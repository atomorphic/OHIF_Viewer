            proxy_http_version 1.1;
            proxy_set_header Host $host;

            add_header 'Access-Control-Allow-Origin' '*' always;

            proxy_pass http://auth-service:8000/filter/metadata/studies/$1/series/$2/metadata$is_args$args;
        }

        # Other DICOMweb endpoints - authenticated
        location /api/dicom-web/ {
            error_page 401 = @login_redirect;
            auth_request /auth/validate;
            auth_request_set $user_groups $upstream_http_x_user_groups;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Groups $user_groups;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Don't buffer requests for STOW-RS
            proxy_request_buffering off;

            expires 0;
            add_header Cache-Control private;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

            # Handle CORS preflight requests
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass http://orthanc:8042/dicom-web/;
        }

        # UserA filtered endpoint (legacy - kept for backward compatibility)
        location = /pacs-userA/studies {
            proxy_set_header X-Forwarded-Groups "annotatorA";
            proxy_http_version 1.1;
            proxy_set_header Host $host;

            expires 0;
            add_header Cache-Control private;
            add_header 'Access-Control-Allow-Origin' '*' always;

            proxy_pass http://auth-service:8000/filter/studies$is_args$args;
        }

        location /pacs-userA/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;

            expires 0;
            add_header Cache-Control private;
            add_header 'Access-Control-Allow-Origin' '*' always;

            proxy_pass http://orthanc:8042/dicom-web/;
        }

        location /pacs-userA {
            return 301 /pacs-userA/;
        }

        # UserB filtered endpoint
        location = /pacs-userB/studies {
            proxy_set_header X-Forwarded-Groups "annotatorB";
